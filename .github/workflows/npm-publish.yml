name: Publish to npm

# push 到 main 即发布。改 package.json 的 version 就等于「准备发版」。
#
# 走 **令牌流**：仓库 secret `NPM_TOKEN`（与 nx-sk 共用同一个 npm 账号 flowot 的令牌）。
# 想换成零令牌的 Trusted Publishing（OIDC）时，删掉下面的 NODE_AUTH_TOKEN 注入、
# 去掉 setup-node 的 registry-url、加 OIDC 预检步骤，并在 npm 侧配一次 trust 关系即可。
on:
  push:
    branches: [main]

permissions:
  contents: write   # 打 tag 需要
  id-token: write   # --provenance 签名需要（OIDC）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须 0：浅克隆下 git rev-parse <tag> 查不到历史 tag，会重复打 tag
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 不另外指定 version —— pnpm/action-setup 会读 package.json 的 packageManager，
      # 两边都写反而容易不一致
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

      - name: 读版本号
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 已存在则跳过（幂等）
        id: check
        # if: 表达式里**不能用 secrets 上下文**（解析期直接报
        # "Unrecognized named-value: 'secrets'"，整个 run 0 秒失败）——
        # 判定 token 在不在必须经 env 间接传进 run 块
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          echo "hasToken=$HAS_TOKEN" >> $GITHUB_OUTPUT
          if git rev-parse "${{ steps.pkg.outputs.tag }}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi
          if npm view ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} version >/dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: 缺 NPM_TOKEN 时明确提示（而不是静默失败）
        if: steps.check.outputs.published == 'false' && steps.check.outputs.hasToken == 'false'
        run: |
          echo "::warning::仓库缺少 NPM_TOKEN，已跳过发布。"
          echo "补上：gh secret set NPM_TOKEN --body <Automation Token> --repo On-DevPlan/nx-ditto"

      - name: 打 tag
        if: steps.check.outputs.tag_exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.pkg.outputs.tag }}" -m "Release ${{ steps.pkg.outputs.tag }}"
          git push origin "${{ steps.pkg.outputs.tag }}"

      - name: 发布
        if: steps.check.outputs.published == 'false' && steps.check.outputs.hasToken == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
